name: FHIR range formatting (standalone Dart)

'on':
  pull_request:
    paths:
      - 'lib/core/utils/fhir_reference_range_formatter.dart'
      - 'lib/features/records/domain/entity/observation/observation.dart'
      - 'tool/check_fhir_reference_range.dart'
      - '.github/workflows/fhir-reference-range.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.3'
      - name: Verify reference range helper (no pub get / private SSH packages)
        run: dart tool/check_fhir_reference_range.dart
